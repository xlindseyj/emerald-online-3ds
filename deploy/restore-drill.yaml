# Isolated restore validation. Apply only for a recovery drill, verify the
# marker/schema, then delete this Cluster and its PVC. It never receives app
# traffic and does not write backups into the production object-store prefix.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: emerald-pg-restore-check
  namespace: pokemonemeraldonline3ds
  labels:
    app.kubernetes.io/name: emerald-postgres-restore-check
    app.kubernetes.io/part-of: emerald-online-3ds
spec:
  description: Temporary isolated Emerald Online backup restore validation
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6@sha256:30b304a2e300ed80b6d1b740e4369e9b0f25599fb518de78c01fd9f25531791b
  bootstrap:
    recovery:
      source: emerald-pg-backup
  externalClusters:
    - name: emerald-pg-backup
      barmanObjectStore:
        destinationPath: s3://cnpg-backups/emerald-online-3ds
        endpointURL: http://minio.lindseywebsolutions.svc.cluster.local:9000
        serverName: emerald-pg
        s3Credentials:
          accessKeyId:
            name: emerald-backup
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: emerald-backup
            key: ACCESS_SECRET_KEY
        wal:
          maxParallel: 2
  storage:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [lws-desktop, lws-homelab]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-restore-operator
  namespace: pokemonemeraldonline3ds
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: emerald-pg-restore-check
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-restore-kubernetes-api
  namespace: pokemonemeraldonline3ds
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: emerald-pg-restore-check
  policyTypes: [Egress]
  egress:
    - {}
